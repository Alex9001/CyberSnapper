name: Native Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive rebuilt packages (leave blank for a rehearsal)
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: Linux x64, artifact: CyberSnapper-linux-x64 }
          - { os: windows-2022, name: Windows x64, artifact: CyberSnapper-windows-x64 }
          - { os: macos-15-intel, name: macOS x64, artifact: CyberSnapper-macos-x64 }
          - { os: macos-15, name: macOS arm64, artifact: CyberSnapper-macos-arm64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install and verify worker
        shell: bash
        run: |
          npm ci
          npm run typecheck:worker
          npm run build:worker
          npm run test:worker

      - name: Bundle Chromium
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npx playwright install chromium

      - name: Install Chromium host dependencies
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npx playwright install-deps chromium

      - name: Stage Node runtime (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p .runtime && cp "$(command -v node)" .runtime/node && chmod +x .runtime/node

      - name: Stage Node runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force .runtime; Copy-Item (Get-Command node).Source .runtime/node.exe

      - name: Configure and build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCYBERSNAPPER_BUILD_TESTS=ON
          cmake --build build/native --parallel
          ctest --test-dir build/native --output-on-failure

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64 -DCYBERSNAPPER_BUILD_TESTS=ON
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native -C Release --output-on-failure

      - name: Keep production worker dependencies
        run: npm prune --omit=dev

      - name: Install application (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --install build/native --prefix stage --config Release

      - name: Install application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --install "$env:GITHUB_WORKSPACE/build/native" --prefix "$env:GITHUB_WORKSPACE/stage" --config Release

      - name: Deploy Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -version "[17.0,18.0)" -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          . "$visualStudio\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation
          windeployqt --release --no-translations stage/bin/CyberSnapper.exe
          windeployqt --release --no-translations stage/bin/cybersnapper-agent.exe
          Remove-Item stage/bin/sqldrivers/qsqlmimer.dll,stage/bin/sqldrivers/qsqlodbc.dll,stage/bin/sqldrivers/qsqlpsql.dll -ErrorAction SilentlyContinue
          Compress-Archive -Path stage/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Deploy Qt and sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          macdeployqt stage/CyberSnapper.app \
            -executable=stage/CyberSnapper.app/Contents/MacOS/cybersnapper-agent \
            -executable=stage/CyberSnapper.app/Contents/MacOS/cybersnapper-cli
          frameworks=stage/CyberSnapper.app/Contents/Frameworks
          cp -L "$QT_ROOT_DIR/lib/libbrotlicommon.1.dylib" "$frameworks/libbrotlicommon.1.dylib"
          for library in "$frameworks/libbrotlidec.1.dylib" "$frameworks/libbrotlienc.1.dylib"; do
            install_name_tool -change @rpath/libbrotlicommon.1.dylib \
              @loader_path/libbrotlicommon.1.dylib "$library"
          done
          rm -f stage/CyberSnapper.app/Contents/PlugIns/sqldrivers/libqsql{mimer,odbc,psql}.dylib
          codesign --force --deep --sign - stage/CyberSnapper.app
          ditto -c -k --sequesterRsrc --keepParent stage/CyberSnapper.app ${{ matrix.artifact }}.zip

      - name: Deploy Qt (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build/release-qt-plugins/{platforms,sqldrivers,imageformats,iconengines,platforminputcontexts,xcbglintegrations,tls}
          cp "$QT_ROOT_DIR/plugins/platforms/libqxcb.so" build/release-qt-plugins/platforms/
          cp "$QT_ROOT_DIR/plugins/sqldrivers/libqsqlite.so" build/release-qt-plugins/sqldrivers/
          cp "$QT_ROOT_DIR"/plugins/imageformats/libq{gif,ico,jpeg,svg}.so build/release-qt-plugins/imageformats/
          cp "$QT_ROOT_DIR/plugins/iconengines/libqsvgicon.so" build/release-qt-plugins/iconengines/
          cp "$QT_ROOT_DIR/plugins/platforminputcontexts/libcomposeplatforminputcontextplugin.so" build/release-qt-plugins/platforminputcontexts/
          cp "$QT_ROOT_DIR"/plugins/xcbglintegrations/libqxcb-{egl,glx}-integration.so build/release-qt-plugins/xcbglintegrations/
          cp "$QT_ROOT_DIR"/plugins/tls/libq{certonly,openssl}backend.so build/release-qt-plugins/tls/
          curl -L -o linuxdeployqt.AppImage https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt.AppImage
          export CYBERSNAPPER_REAL_QMAKE="$QT_ROOT_DIR/bin/qmake"
          export CYBERSNAPPER_RELEASE_PLUGINS="$PWD/build/release-qt-plugins"
          ./linuxdeployqt.AppImage --appimage-extract-and-run stage/bin/CyberSnapper \
            -qmake="$PWD/scripts/release-qmake-wrapper.sh" \
            -executable=stage/bin/cybersnapper-agent \
            -executable=stage/bin/cybersnapper-cli \
            -bundle-non-qt-libs -unsupported-allow-new-glibc
          tar -C stage -czf ${{ matrix.artifact }}.tar.gz .

      - name: Smoke test package (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH stage/bin/cybersnapper-cli --version

      - name: Smoke test package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 1
        run: |
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          & ".\stage\bin\cybersnapper-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI exited with $LASTEXITCODE" }

      - name: Smoke test package (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 1
        run: env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH stage/CyberSnapper.app/Contents/MacOS/cybersnapper-cli --version

      - name: Attest package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifact }}.*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  publish:
    needs: package
    if: github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create SHA-256 checksums
        shell: bash
        run: sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: artifacts/*
