version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "05:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
